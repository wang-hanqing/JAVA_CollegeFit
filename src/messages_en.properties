# ---------- Input errors ----------
error.sat=Each SAT section must be a number between 200 and 800.
error.budget=Budget cannot be negative.
error.state=Use a two-letter state code, such as NY.
error.number=SAT sections and budget must be whole numbers.
error.title=Check your answers

# ---------- Money ----------
money.notReported=not reported
money.zeroOrLess=$0 or less on average

# ---------- Academic lens ----------
academic.open.label=Open admission
academic.open.explain=This college has an open admission policy: students who finish high school can usually enroll. Some programs, such as nursing, may still have their own requirements.
academic.open.next=
