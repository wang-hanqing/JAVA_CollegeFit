academic.policy.5=Test scores: considered, not required (IPEDS, fall 2024).
academic.policy.none=Test policy: not reported.
academic.below.label=Below reported range
academic.below.explain=At least one of your SAT sections is below the score of the middle 50% of admitted students. This is not an admission decision.
academic.selective.label=Highly selective
academic.selectiveWithScores.explain=Your scores are in or above the reported range, but this college admits fewer than 15% of applicants, so strong scores alone are not enough.
academic.selective.explain=This college admits fewer than 15% of applicants.
academic.within.label=Within reported range
academic.within.explain=Your SAT sections are in or above the range of the middle 50% of admitted students. Admission is never guaranteed.
academic.moreInfo.label=More info needed
academic.moreInfo.explain=Without test scores we can only describe how selective the college is, not how you compare.
academic.next=Check the college's current admission and test requirements.

