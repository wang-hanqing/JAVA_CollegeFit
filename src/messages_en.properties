# ---------- Sorting ----------
SortOrder.BEST_FIT=Best fit
SortOrder.EASIER_ADMISSION=Easier admission first
SortOrder.LOWEST_COST=Lowest reference cost
SortOrder.NAME=Name (A to Z)
sort.label=Sort by
sort.explain.BEST_FIT=Best fit: program evidence first, then fewest mismatches, most social preferences matched, your preferred state, then name. Admission difficulty and price are not used.
sort.explain.EASIER_ADMISSION=Easier admission first: open admission colleges, then higher admission rates. This describes the college, not your chances.
sort.explain.LOWEST_COST=Lowest reference cost first: average net price for your income range where it applies, otherwise the published cost. Not your personal price.
sort.explain.NAME=Alphabetical order.

