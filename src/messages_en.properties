# CollegeFit text, English. Placeholders %s are filled by Messages.get(key, values...).
# A literal percent sign inside a text that has placeholders must be written as %%.

# ---------- App ----------
app.title=CollegeFit
app.tagline=Start with what you know. Understand your options. Know what to do next.
app.footer=Prototype using public historical College Scorecard data. No admission predictions, aid promises or immigration questions.

