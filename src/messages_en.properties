# ---------- Next steps from "not sure" answers ----------
step.pathway=Compare associate and bachelor's pathways, including transferring from a community college.
step.program=Explore a few programs that interest you.
step.sat=Check each college's current test policy.
step.aid=Ask staff whether you can file the FAFSA. Do not share immigration documents in this app.
step.budget=Talk with your family about a yearly college budget.
step.income=Learn what "net price" means; sharing income is optional.
step.support=Bring your list to 1-on-1 support.

